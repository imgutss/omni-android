name: Omni APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to build and publish, without the leading v (for example 0.3.0)'
        required: false
        type: string
  push:
    branches:
      - omni
      - omni-masterdns

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The latest stable release, as aether's own release workflow builds with. The libaether
      # cache is keyed by the rustc it installs, so a new stable release builds the core afresh.
      RUST_TOOLCHAIN: "stable"
      # The Go line the Psiphon client's go.mod asks for, which also covers lyrebird's older one;
      # aether/psiphon-build.sh and aether/pt-build.sh pin the programs themselves. Bump it when a
      # bumped aether submodule pins a program that asks for a newer line.
      GO_VERSION: "1.26"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        # The client is built from a checkout of its own; there is no go.sum here to cache by.
        cache: false

    - name: Restore cached MasterDnsVPN client
      id: cache-masterdns-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-masterdns
        key: masterdns-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('compile-masterdns.sh', 'third_party/masterdnsvpn/**') }}

    - name: Build MasterDnsVPN client
      if: steps.cache-masterdns-restore.outputs.cache-hit != 'true'
      run: bash compile-masterdns.sh

    - name: Test MasterDnsVPN upstream packages
      run: |
        cd third_party/masterdnsvpn
        GOTOOLCHAIN=local CGO_ENABLED=0 go test ./...

    - name: Save MasterDnsVPN client
      if: steps.cache-masterdns-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-masterdns
        key: masterdns-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('compile-masterdns.sh', 'third_party/masterdnsvpn/**') }}

    # The Aether core runs Psiphon as a program of its own, the psiphon-tunnel-core console client,
    # which the app ships beside the core as libpsiphon-tunnel-core.so; see compile-psiphon.sh.
    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    # Tor's bridges run through a pluggable transport, a program of its own: lyrebird, which aether
    # builds and the app ships beside the core as liblyrebird.so; see compile-pt.sh.
    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-masterdns/. ${{ github.workspace }}/V2rayNG/app/libs/

    # Psiphon's client starts with the newest server list the build could fetch, so a fresh install has
    # servers before it can reach the list on its own; see fetch-psiphon-servers.sh.
    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Omni keystore
      id: android_keystore
      run: |
        test -n "${{ secrets.OMNI_KEYSTORE_BASE64 }}"
        printf '%s' '${{ secrets.OMNI_KEYSTORE_BASE64 }}' | base64 -d > android_keystore.jks
        echo "filePath=$GITHUB_WORKSPACE/android_keystore.jks" >> "$GITHUB_OUTPUT"

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        # The JVM unit tests are the only automated check of the Kotlin logic; a failure stops the
        # build before anything is assembled or signed.
        ./gradlew :app:testPlaystoreDebugUnitTest
        ./gradlew assemblePlaystoreRelease -PpattngVersion="${{ inputs.release_tag || '0.6.0' }}" -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.OMNI_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.OMNI_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.OMNI_KEY_PASSWORD }}
    
    - name: Check the native libraries in the APKs
      run: |
        # Looked into as ZIP files: every ABI the Aether core is built for has to carry the core, its
        # Psiphon client and its pluggable transport, and each APK's native files are listed for the record.
        status=0
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk; do
          entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
          echo "$(basename "$apk"):"
          echo "$entries" | sed 's/^/  /'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$entries" | grep -q "^lib/$abi/" || continue
            for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
              if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                echo "::error::$(basename "$apk") lacks lib/$abi/$lib"
                status=1
              fi
            done
          done
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "$entries" | grep -q "^lib/$abi/" || continue
            if ! echo "$entries" | grep -qx "lib/$abi/libmasterdns.so"; then
              echo "::error::$(basename "$apk") lacks lib/$abi/libmasterdns.so"
              status=1
            fi
          done
        done
        exit $status

    - name: Upload Omni APKs
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: omni-apks
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
        if-no-files-found: error
        retention-days: 30

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download signed APKs
      uses: actions/download-artifact@v4
      with:
        name: omni-apks
        path: release-apks

    - name: Publish permanent release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ inputs.release_tag }}
        RELEASE_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "Release version must look like 0.3.0, without a leading v" >&2
          exit 1
        fi
        cd release-apks
        test -n "$(find . -maxdepth 1 -name '*.apk' -print -quit)"
        sha256sum ./*.apk > SHA256SUMS
        gh release create "v${RELEASE_VERSION}" ./*.apk ./SHA256SUMS \
          --repo "$RELEASE_REPOSITORY" \
          --target "${{ github.sha }}" \
          --title "Omni v${RELEASE_VERSION}" \
          --generate-notes
